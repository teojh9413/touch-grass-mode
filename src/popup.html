<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Touch Grass Mode</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <div class="brand">
      <div class="logo">TG</div>
      <div>
        <h1>Touch Grass Mode</h1>
        <p>Anti-revenge-trading circuit breaker.</p>
      </div>
    </div>

    <section id="status" class="status">Open a trading page, then run a support check.</section>
    <p class="build">Local build 0.1.1</p>

    <div class="buttons">
      <button id="enableSite">Enable current site</button>
      <button id="checkSupport">Check support</button>
      <button id="testOverlay">Test overlay</button>
      <button id="clearOverlay" class="muted">Clear overlay</button>
      <button id="openOptions" class="muted">Options</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
